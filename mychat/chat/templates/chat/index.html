<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />

        <title>Подбор образовательной программы</title>

        <style>
            body {
                background: #111;
                color: white;
                font-family: Arial;
                margin: 0;
            }

            .container {
                max-width: 1000px;
                margin: auto;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .chat {
                flex: 1;
                overflow-y: auto;
                padding: 20px;
            }

            .message {
                padding: 15px;
                margin-bottom: 15px;
                border-radius: 12px;
                white-space: pre-line;
            }

            .user {
                background: #2b2b2b;
                margin-left: 150px;
            }

            .bot {
                background: #1b1b1b;
                border: 1px solid #444;
                margin-right: 150px;
            }

            .input-area {
                display: flex;
                padding: 20px;
                border-top: 1px solid #333;
            }

            input {
                flex: 1;
                padding: 15px;
                font-size: 16px;
                border: none;
                border-radius: 10px;
            }

            button {
                margin-left: 10px;
                padding: 15px 25px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="chat" id="chat">
                {% for msg in messages %}
                <div class="message {{ msg.role }}">{{ msg.text }}</div>
                {% endfor %}
            </div>

            <div class="input-area">
                <input
                    id="message"
                    placeholder="Например: хочу заниматься искусственным интеллектом"
                />

                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>

        <script>
            function sendMessage() {
                let input = document.getElementById("message");

                let text = input.value.trim();

                if (!text) return;

                fetch("/send/", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}",
                    },
                    body: new URLSearchParams({
                        message: text,
                    }),
                })
                    .then((r) => r.json())
                    .then((data) => {
                        let chat = document.getElementById("chat");

                        chat.innerHTML += `
            <div class="message user">${data.user}</div>
            <div class="message bot">${data.bot}</div>
        `;

                        input.value = "";

                        chat.scrollTop = chat.scrollHeight;
                    });
            }
        </script>
    </body>
</html>
